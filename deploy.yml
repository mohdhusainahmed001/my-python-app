- hosts: managers
  tasks:
    - name: Deploy my-python-app service
      community.docker.docker_swarm_service:
        name: my-python-app
        image: "{{ image_name }}"
        state: present
        mode: replicated
        replicas: "{{ replicas | default(2) }}"
        publish:
          - published_port: 8080
            target_port: 8080

